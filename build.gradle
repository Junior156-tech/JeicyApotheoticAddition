plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'org.jeicy.apotheoticadditions'
version = '1.21.1'
base.archivesName = 'JeicyApotheoticAddition'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven {
        name = 'TeamTwilight'
        url = 'https://maven.tamaized.com/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = '21.1.251'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        apotheotic_additions { sourceSet sourceSets.main }
    }
}

// Exact 1.21.1 binaries used by Apotheosis 8.8.0. Modrinth's Maven POMs do
// not publish transitive dependencies, so every required runtime mod is pinned
// explicitly. This project intentionally has no AO Port or KubeJS dependency.
dependencies {
    implementation 'maven.modrinth:rqFWfVlz:nEWTeHFF'
    implementation 'maven.modrinth:tCkE8p2N:1Ypo4tf4' // Placebo 9.9.2
    implementation 'maven.modrinth:DGaH8Rh0:Xtaunf84' // Apothic Attributes 2.10.1
    runtimeOnly 'maven.modrinth:nU0bVIaL:BIogJv2D' // Patchouli 93
    runtimeOnly 'maven.modrinth:DfxVkOAO:pWfxcfO2' // Apothic Spawners 1.4.0
    runtimeOnly 'maven.modrinth:pL8MtgqY:2vH7csNR' // Apothic Enchanting 1.6.2
    runtimeOnly 'maven.modrinth:YhmgMVyu:K5X5qMwG' // The Aether 1.21.1-1.5.10 NeoForge
    runtimeOnly 'maven.modrinth:ccKDOlHs:NMCHU6DZ' // owo-lib 0.12.15.5 (required by Aether)
    runtimeOnly 'team-twilight:twilightforest:4.8.3802:universal' // Twilight Forest 1.21.1
    runtimeOnly 'maven.modrinth:Ejfl5qDL:sY4KZ9q3' // The Undergarden 1.21.1-0.9.6
    runtimeOnly 'maven.modrinth:R2OftAxM:XTVZDOol' // Farmer's Delight 1.21.1-1.3.4
    runtimeOnly 'maven.modrinth:FoVacERa:fTRMVgyZ' // Lionfish API 3.1
    runtimeOnly 'maven.modrinth:vvuO3ImH:yohfFbgD' // Curios API 9.5.1+1.21.1
    runtimeOnly 'maven.modrinth:46KJle7n:PsPYpoCC' // L_Ender's Cataclysm 1.21.1-3.33
    runtimeOnly 'maven.modrinth:8BmcQJ2H:Grwn5rUB' // GeckoLib 4.9.3 (required by Ars Nouveau)
    runtimeOnly 'maven.modrinth:TKB6INcv:yWDnir1o' // Ars Nouveau 1.21.1-5.13.3
    runtimeOnly 'maven.modrinth:G1hIVOrD:x99nCLTm' // Resourceful Lib 1.21-3.0.12
    runtimeOnly 'maven.modrinth:38tpSycf:LwGXnQCW' // The Bumblezone 7.17.3+1.21.1

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
